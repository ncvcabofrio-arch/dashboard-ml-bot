name: Repricer - Aplicar promocoes (Fase 2)

# Lê a FILA de promoções aprovadas no painel (repricer_promo_fila, status='aprovada'),
# RE-CHECA a margem agora e entra na promoção no ML.
# DRY_RUN=SIM (padrão) => só SIMULA: mostra o POST e a margem, não aplica nada.
# DRY_RUN=NAO          => aplica de verdade. Comece sempre com SIM e 1 item (max_aplicar=1).
on:
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Conta: 177795203=CF, 471489691=Cabo Frio, 3244206480=MG (vazio = todas)"
        type: string
        required: false
        default: "177795203"
      dry_run:
        description: "SIM = só simula (recomendado) | NAO = aplica de verdade"
        type: choice
        options: ["SIM", "NAO"]
        default: "SIM"
      item_id:
        description: "Aplicar só ESTE anúncio (vazio = todos os aprovados da conta)"
        type: string
        required: false
        default: ""
      max_aplicar:
        description: "Máx. de itens nesta rodada (0 = todos; use 1 no primeiro teste real)"
        type: string
        required: false
        default: "0"

concurrency:
  group: ml-puxador
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Aplicar promocoes
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          SELLER_ID:   ${{ github.event.inputs.seller_id }}
          ITEM_ID:     ${{ github.event.inputs.item_id }}
          DRY_RUN:     ${{ github.event.inputs.dry_run == 'NAO' && '0' || '1' }}
          MAX_APLICAR: ${{ github.event.inputs.max_aplicar || '0' }}
        run: python repricer_promo_aplicar.py
