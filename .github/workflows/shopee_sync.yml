name: Shopee - pedidos
on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias pra trás puxar (padrão 15; use 180 pra backfill)"
        required: false
        default: "15"
      debug:
        description: "Mostrar resposta crua da Shopee? (1 = sim)"
        required: false
        default: "0"
  schedule:
    - cron: "30 9,15,21 * * *"   # 06h30, 12h30 e 18h30 de Brasília

concurrency:
  group: shopee-pedidos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python shopee_pedidos.py
        env:
          PYTHONUNBUFFERED: "1"
          SHOPEE_PARTNER_ID:  ${{ secrets.SHOPEE_PARTNER_ID }}
          SHOPEE_PARTNER_KEY: ${{ secrets.SHOPEE_PARTNER_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DIAS:  ${{ inputs.dias  || '15' }}
          DEBUG: ${{ inputs.debug || '0' }}
