name: Repricer - Mapa (resumo + check + reparo)

# Tudo-em-um do mapa. Padrao = SIMULACAO (resumo + check dos sem_concorrente).
# Com confirma=SIM, grava o reparo dos que têm catalog_product_id nativo.
# Substitui os antigos "Ver Mapa", "Checar Mapa" e "Reparo".
on:
  workflow_dispatch:
    inputs:
      confirma:
        description: "Aplicar o reparo (gravar no mapa)? (NAO = só resumo/check)"
        type: choice
        required: true
        default: "NAO"
        options: ["NAO", "SIM"]
      excluir:
        description: "Chaves a NÃO gravar no reparo (id nativo suspeito), separadas por vírgula"
        type: string
        required: false
        default: ""
      research:
        description: "Rebuscar os avulsos com a busca melhorada e mostrar candidatos? (só leitura)"
        type: choice
        required: false
        default: "NAO"
        options: ["NAO", "SIM"]

jobs:
  mapa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Ferramenta do mapa
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          CONFIRMA:         ${{ github.event.inputs.confirma || 'NAO' }}
          EXCLUIR:          ${{ github.event.inputs.excluir }}
          RESEARCH:         ${{ github.event.inputs.research || 'NAO' }}
        run: python repricer_mapa.py
