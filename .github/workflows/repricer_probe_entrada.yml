name: Repricer - PROBE de entrada (caca start_date + tenta entrar)

# 1) CACA a start_date do item em ~10 consultas diferentes (mostra em qual aparece).
# 2) Tenta ENTRAR usando a data achada, testando varios formatos, parando no 1o OK.
# ATENCAO: se so_cacar=0, MEXE NO ANUNCIO (entra de verdade). SMART e reversivel.
# Dica: rode 1o com so_cacar=1 (so consulta, nao entra). Depois sair_depois=1 (entra e desfaz).
on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Anuncio (MLB...)"
        type: string
        required: true
      promo_id:
        description: "ID da promocao (P-MLB...)"
        type: string
        required: true
      promo_tipo:
        description: "Tipo (SMART, PRICE_MATCHING, BANK...)"
        type: string
        required: false
        default: "SMART"
      seller_id:
        description: "Conta: 177795203=CF, 471489691=Cabo Frio, 3244206480=MG"
        type: string
        required: false
        default: "177795203"
      so_cacar:
        description: "1 = SO caca a start_date (NAO entra) | 0 = tambem tenta entrar"
        type: string
        required: false
        default: "1"
      sair_depois:
        description: "1 = entra e desfaz na hora (teste) | 0 = fica na promocao"
        type: string
        required: false
        default: "1"
      win_start:
        description: "(opcional) forcar start_date, ex.: 2026-07-22T12:00:00"
        type: string
        required: false
        default: ""
      win_finish:
        description: "(opcional) forcar finish_date"
        type: string
        required: false
        default: ""

concurrency:
  group: ml-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Probe de entrada
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          SELLER_ID:        ${{ github.event.inputs.seller_id }}
          ITEM_ID:          ${{ github.event.inputs.item_id }}
          PROMO_ID:         ${{ github.event.inputs.promo_id }}
          PROMO_TIPO:       ${{ github.event.inputs.promo_tipo }}
          SO_CACAR:         ${{ github.event.inputs.so_cacar }}
          SAIR_DEPOIS:      ${{ github.event.inputs.sair_depois }}
          WIN_START:        ${{ github.event.inputs.win_start }}
          WIN_FINISH:       ${{ github.event.inputs.win_finish }}
        run: python repricer_probe_entrada.py
