name: Bling - gerar token
# Gera o token de UMA conta do Bling por vez. Cada conta tem seu próprio app.
on:
  workflow_dispatch:
    inputs:
      conta:
        description: "Qual conta"
        required: true
        type: choice
        options:
          - PONTOMUSICAL_CF
          - CABOFRIO
          - MG
      client_id:
        description: "Client Id do app DESSA conta"
        required: true
      code:
        description: "Código que apareceu no fim da URL depois de autorizar"
        required: true
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python gerar_token_bling.py
        env:
          BLING_SECRET_PONTOMUSICAL_CF: ${{ secrets.BLING_SECRET_PONTOMUSICAL_CF }}
          BLING_SECRET_CABOFRIO: ${{ secrets.BLING_SECRET_CABOFRIO }}
          BLING_SECRET_MG: ${{ secrets.BLING_SECRET_MG }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          CONTA: ${{ inputs.conta }}
          CLIENT_ID: ${{ inputs.client_id }}
          CODE: ${{ inputs.code }}
