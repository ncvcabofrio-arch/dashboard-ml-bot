name: Repricer - Sonda Competitiva (Fase 1, leitura)

# Cruza seus anúncios de CATÁLOGO com a concorrência (price_to_win + concorrentes)
# e a sua margem, e imprime a DECISÃO que o robô tomaria. NÃO escreve nada.
on:
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Conta a analisar. Ex: 177795203"
        type: string
        required: true
        default: ""
      max_itens:
        description: "Quantos anúncios amostrar (comece pequeno, ex 30)"
        type: string
        required: false
        default: "30"
      debug_item:
        description: "DEBUG: analisar só 1 item (ex MLB1538099519) mostrando as buscas"
        type: string
        required: false
        default: ""

concurrency:
  group: ml-puxador
  cancel-in-progress: false

jobs:
  competitivo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Sondar concorrencia (so leitura)
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          SELLER_ID:  ${{ github.event.inputs.seller_id }}
          MAX_ITENS:  ${{ github.event.inputs.max_itens }}
          DEBUG_ITEM: ${{ github.event.inputs.debug_item }}
          DEBUG:      ${{ github.event.inputs.debug_item != '' && '1' || '' }}
        run: python repricer_competitivo.py
