name: Repricer - Promocoes (sonda, so leitura)

# Roda so quando voce clicar (Actions -> este workflow -> Run workflow).
# Sonda descartavel: hoje despeja o JSON cru das promocoes de UM item. Nao altera nada.
on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Item MLB a diagnosticar"
        required: false
        default: "MLB6415054256"

concurrency:
  group: ml-puxador
  cancel-in-progress: false

jobs:
  promocoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests supabase

      - name: Rodar sonda de promocoes
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          ITEM_ID: ${{ github.event.inputs.item_id }}
        run: python repricer_promocoes.py
