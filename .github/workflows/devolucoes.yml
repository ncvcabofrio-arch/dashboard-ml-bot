name: Puxador de Devolucoes (RMA)

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min (devolucao nao precisa ser tao rapida quanto venda)
  workflow_dispatch:          # permite rodar na mao pelo botao "Run workflow"
    inputs:
      modo:
        description: "O que rodar"
        required: false
        type: choice
        default: normal
        options:
          - normal
          - debug
          - retorno
          - caso
          - pedido
          - scan
          - backfill
          - monitor
          - limpar_coleta
          - checar_coleta
          - claims_abertas
          - mediacoes
          - mapear_coleta
          - diag_coleta
          - classificar_coleta
      dias:
        description: "Quantos dias para tras buscar (padrao 30)"
        required: false
        default: "30"
      pedido:
        description: "Order_id(s) p/ modo=caso/pedido. No modo=limpar_coleta, escreva 'aplicar' para mover de verdade."
        required: false
        default: ""

jobs:
  puxar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests supabase
      - name: Rodar puxador de devolucoes
        env:
          ML_CLIENT_ID:      ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:  ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:  ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO:              ${{ github.event.inputs.modo }}
          DIAS_DEVOLUCAO:    ${{ github.event.inputs.dias }}
          PEDIDO_DEBUG:      ${{ github.event.inputs.pedido }}
        run: python puxador_devolucoes.py

      # No AGENDAMENTO tambem roda o monitor (esteira dos envios com problema).
      # Nas rodadas manuais nao roda aqui — voce escolhe 'monitor' na lista se quiser.
      - name: Monitor de envios com problema
        if: github.event_name == 'schedule'
        env:
          ML_CLIENT_ID:      ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:  ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:  ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO:              monitor
        run: python puxador_devolucoes.py

      # No AGENDAMENTO tambem checa prazos de reclamacoes/mediacoes abertas e alerta.
      - name: Prazos de mediacoes (alerta)
        if: github.event_name == 'schedule'
        env:
          ML_CLIENT_ID:      ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:  ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:  ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:      ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO:              mediacoes
        run: python puxador_devolucoes.py
