name: Repricer - Fila de reprocessamento (retry de hora em hora)

# Reprocessa SÓ os itens que erraram/aguardam na tabela repricer_promo_retry
# (RETRY_ONLY=1 -> NÃO aplica a fila 'aprovada'; isso é você clicando no painel).
# Cada item re-resolve pela sugestão FRESCA: se a promoção mudou, NÃO troca sozinho,
# marca 'divergência' e para. Roda de hora em hora; pula se as sugestões estiverem rodando.
on:
  schedule:
    - cron: "20 * * * *"        # todo minuto 20 de cada hora
  workflow_dispatch:
    inputs:
      seller_id:
        description: "(opcional) travar numa conta: 177795203=CF, 471489691=Cabo Frio, 3244206480=MG"
        type: string
        required: false
        default: ""

concurrency:
  group: ml-aplicador          # mesma trava do aplicador manual (não rodam juntos)
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Reprocessar fila de retry
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          DRY_RUN:          "0"
          RETRY_ONLY:       "1"
          SELLER_ID:        ${{ github.event.inputs.seller_id }}
        run: python repricer_promo_aplicar.py
