name: Repricer - Diagnostico de promocoes (so leitura)

# Despeja no LOG tudo que a API de promocoes sabe de UM anuncio (todos os GETs).
# NAO altera nada. Use pra investigar um item especifico.
on:
  workflow_dispatch:
    inputs:
      seller_id:
        description: "Conta: 177795203=CF, 471489691=Cabo Frio, 3244206480=MG"
        type: string
        required: false
        default: "177795203"
      item_id:
        description: "Anuncio (MLB...) a diagnosticar"
        type: string
        required: true

concurrency:
  group: ml-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Diagnostico
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          SELLER_ID:        ${{ github.event.inputs.seller_id }}
          ITEM_ID:          ${{ github.event.inputs.item_id }}
        run: python repricer_diag.py
