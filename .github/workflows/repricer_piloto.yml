name: Repricer - PILOTO

# Roda o repricer completo numa conta (padrão MG), com trilhos de segurança.
# As REGRAS vêm do painel (repricer_config); inputs abaixo só pra override por rodada.
# Agendado = SIMULAÇÃO (alimenta o painel sem escrever). Ao vivo = workflow_dispatch com confirma=SIM.
on:
  schedule:
    - cron: '0 * * * *'   # de hora em hora: por padrão SIMULA e registra no log/planilha
  workflow_dispatch:
    inputs:
      confirma:
        description: "Aplicar de verdade? (NAO = simulação)"
        type: choice
        required: true
        default: "NAO"
        options: ["NAO", "SIM"]
      ativo:
        description: "Botão de pânico: NAO = não escreve nada"
        type: choice
        required: true
        default: "SIM"
        options: ["SIM", "NAO"]
      max_alteracoes:
        description: "Teto de criações/rodada (vazio = usa painel; 0 = sem teto)"
        type: string
        required: false
        default: ""
      max_drop_pct:
        description: "Anti-salto: maior % permitido (vazio = usa painel; ex 90 = ver tudo)"
        type: string
        required: false
        default: ""
      vendas_dias:
        description: "Janela do gate de vendas em dias (vazio = usa painel)"
        type: string
        required: false
        default: ""
      seller_id:
        description: "Conta: 3244206480=MG, 471489691=Cabo Frio, 177795203=CF"
        type: string
        required: false
        default: "3244206480"

concurrency:
  group: ml-repricer-piloto
  cancel-in-progress: false

jobs:
  piloto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Rodar piloto
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          # Telegram (opcional): se seus secrets têm outro nome, ajuste o lado direito.
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Agendado (inputs vazios) = SIMULAÇÃO. Só vira ao vivo via workflow_dispatch confirma=SIM.
          SELLER_ID:       ${{ github.event.inputs.seller_id || '3244206480' }}
          CONFIRMA:        ${{ github.event.inputs.confirma || 'NAO' }}
          ATIVO:           ${{ github.event.inputs.ativo || 'SIM' }}
          # regras: vazio -> usa o painel (repricer_config). Preencha só pra forçar nesta rodada.
          MAX_ALTERACOES:  ${{ github.event.inputs.max_alteracoes }}
          MAX_DROP_PCT:    ${{ github.event.inputs.max_drop_pct }}
          VENDAS_DIAS:     ${{ github.event.inputs.vendas_dias }}
        run: python repricer_piloto.py
      - name: Relatorio (empurra pra planilha)
        if: always()   # manda o relatório mesmo se o piloto tropeçar
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          SELLER_ID:        ${{ github.event.inputs.seller_id || '3244206480' }}
          CONFIRMA:         ${{ github.event.inputs.confirma || 'NAO' }}   # define modo live/simulação no aviso
          WEBHOOK_URL:      ${{ secrets.WEBHOOK_URL }}   # URL /exec do Apps Script (a ponte)
          EMAIL_RELATORIO:  'ncvcabofrio@gmail.com'      # p/ quem chega o aviso de hora em hora
          NOME_CONTA:       'Cabo Frio'                  # rótulo amigável nos avisos
          BASE_MARGEM:      '14,3'                        # margem-base (antes do robô) p/ comparar
          RELATORIO_JANELA_MIN:  '90'    # "esta passada" = mudanças aplicadas nos últimos 90 min
          RELATORIO_MARGEM_DIAS: '20'    # painel de margem: últimos 20 dias
        run: python repricer_relatorio.py
