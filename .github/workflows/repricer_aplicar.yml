name: Repricer - Desconto individual (teste 1 item)

# Cria um DESCONTO PRÓPRIO (PRICE_DISCOUNT) num único anúncio, com o preço
# calculado pra bater a MARGEM-ALVO. Nunca mexe no preço do anúncio — é oferta
# na Central de Promoções e some quando expira (máx 14 dias).
# Padrao = SIMULACAO. So escreve com confirma=SIM.
on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "O anúncio. Ex: MLB4214321589"
        type: string
        required: true
        default: ""
      margem_alvo:
        description: "Margem % planejada (ex 18). O robô calcula o preço pra bater isso."
        type: string
        required: false
        default: "18"
      dias:
        description: "Duração do desconto em dias (máx 14)"
        type: string
        required: false
        default: "14"
      deal_price:
        description: "(Opcional) força um preço fixo em vez de calcular pela margem"
        type: string
        required: false
        default: ""
      top_deal_price:
        description: "(Opcional) preço menor só p/ clientes nível 3-6 (loyalty)"
        type: string
        required: false
        default: ""
      confirma:
        description: "Criar de verdade? (NAO = simulacao)"
        type: choice
        required: true
        default: "NAO"
        options: ["NAO", "SIM"]

concurrency:
  group: ml-puxador
  cancel-in-progress: false

jobs:
  desconto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Criar desconto (ou simular)
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          ITEM_ID:        ${{ github.event.inputs.item_id }}
          MARGEM_ALVO:    ${{ github.event.inputs.margem_alvo }}
          DIAS:           ${{ github.event.inputs.dias }}
          DEAL_PRICE:     ${{ github.event.inputs.deal_price }}
          TOP_DEAL_PRICE: ${{ github.event.inputs.top_deal_price }}
          CONFIRMA:       ${{ github.event.inputs.confirma }}
        run: python repricer_aplicar.py
