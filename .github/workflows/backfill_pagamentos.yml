name: Backfill pagamentos (meios combinados)

# Re-consulta SÓ os pedidos divergentes na API do ML e captura todos os
# pagamentos pra ordem_pagamentos. Roda manual, quando precisar. Idempotente.

on:
  workflow_dispatch:
    inputs:
      gap_min:
        description: 'Diferenca minima (R$) pra re-checar um pedido'
        required: false
        default: '0.02'

# mesma trava do robô: nunca roda junto com o puxador (token é de uso único)
concurrency:
  group: ml-puxador
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase
      - name: Rodar backfill direcionado
        env:
          ML_CLIENT_ID:     ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          GAP_MIN:          ${{ github.event.inputs.gap_min || '0.02' }}
        run: python -u backfill_pagamentos.py
